name: Azure what-if

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  what-if:
    name: Preview Azure changes
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CORE_OUTPUT: none
      AZURE_RESOURCE_OWNER: ${{ vars.AZURE_RESOURCE_OWNER }}
      BUDGET_NOTIFICATION_EMAIL: ${{ vars.AZURE_BUDGET_NOTIFICATION_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bicep
        shell: bash
        run: |
          set -euo pipefail

          az bicep install --version v0.46.1
          az bicep version

      - name: Log in to Azure using OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview subscription changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$RESOURCE_OWNER" ]]; then
            echo "AZURE_RESOURCE_OWNER is not configured."
            exit 1
          fi

          if [[ -z "$BUDGET_NOTIFICATION_EMAIL" ]]; then
            echo "AZURE_BUDGET_NOTIFICATION_EMAIL is not configured."
            exit 1
          fi

          budget_start_date="$(date -u +'%Y-%m-01T00:00:00Z')"
          budget_end_date="$(date -u -d '+1 year' +'%Y-%m-01T00:00:00Z')"

          budget_notification_emails="$(
            jq \
              --compact-output \
              --null-input \
              --arg email "$BUDGET_NOTIFICATION_EMAIL" \
              '[$email]'
          )"

          az deployment sub what-if \
            --name "what-if-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --location swedencentral \
            --template-file infra/bicep/main.bicep \
            --parameters \
              resourceOwner="$RESOURCE_OWNER" \
              budgetStartDate="$budget_start_date" \
              budgetEndDate="$budget_end_date" \
              budgetNotificationEmails="$budget_notification_emails" \
            --result-format ResourceIdOnly \
            --output jsonc