name: Azure authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-authentication:
    name: Verify Azure authentication
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure subscription
        shell: bash
        run: |
          set -euo pipefail

          actual_subscription_id="$(
            az account show \
              --query id \
              --output tsv
          )"

          if [[ "$actual_subscription_id" != "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]]; then
            echo "Azure CLI is using an unexpected subscription."
            exit 1
          fi

          az account show \
            --query "{Name:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table